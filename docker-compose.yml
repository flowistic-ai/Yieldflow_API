version: '3.8'

services:
  frontend:
    build:
      context: ./yieldflow-frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - yieldflow-network

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://yieldflow:password@db:5432/yieldflow_db
      - REDIS_URL=redis://redis:6379/0
      - ALPHA_VANTAGE_API_KEY=8U60647QE9JL1KKX
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - yieldflow-network

  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=yieldflow_db
      - POSTGRES_USER=yieldflow
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - yieldflow-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yieldflow-network

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - yieldflow-network

volumes:
  postgres_data:
  redis_data: 

networks:
  yieldflow-network:
    driver: bridge 